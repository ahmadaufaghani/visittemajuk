name: Dependency Review

on:
    pull_request:
        branches:
            - dev

permissions:
    contents: read
    pull-requests: read

jobs:
    dependency-review:
        name: dependency-review
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Review dependency changes
              uses: actions/dependency-review-action@v5
              with:
                  fail-on-severity: high
